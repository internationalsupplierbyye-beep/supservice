<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="BKK and China Supplier POS dashboard for THB and MMK operations." />
    <title>Supplier By YE POS — Supplier Operations</title>
    <style>
:root {
  --navy-950: #0b1120;
  --navy-900: #0f172a;
  --navy-800: #17233b;
  --navy-700: #233252;
  --slate-600: #52627b;
  --slate-500: #71809a;
  --slate-300: #c5cede;
  --slate-200: #e4e9f0;
  --slate-100: #f2f5f8;
  --paper: #fbfcfe;
  --white: #ffffff;
  --amber: #f5b942;
  --amber-soft: #fff4d9;
  --green: #1d9b72;
  --green-soft: #e7f7f0;
  --red: #c84b56;
  --red-soft: #fbecef;
  --blue: #3974c4;
  --shadow: 0 18px 48px rgba(15, 23, 42, 0.09);
  --radius: 14px;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Myanmar", sans-serif;
  color: var(--navy-900);
  background: var(--slate-100);
  font-synthesis: none;
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; background: var(--slate-100); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.mobile-only { display: none !important; }

.auth-shell { min-height: 100vh; display: grid; grid-template-columns: minmax(360px, 0.85fr) minmax(420px, 1.15fr); background: var(--navy-950); }
.auth-card { min-height: 100vh; overflow-y: auto; background: var(--paper); padding: clamp(36px, 7vw, 92px); display: flex; flex-direction: column; justify-content: center; }
.auth-aside { position: relative; overflow: hidden; padding: clamp(42px, 8vw, 110px); display: flex; align-items: flex-end; color: #fff; background: radial-gradient(circle at 82% 20%, rgba(245,185,66,.22), transparent 30%), linear-gradient(145deg, #162441 0%, #0b1120 82%); }
.aside-grid { position: absolute; inset: 0; opacity: .5; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 52px 52px; mask-image: linear-gradient(to bottom, black, transparent 80%); }
.aside-copy { position: relative; max-width: 510px; margin-top: auto; }
.aside-number { font-size: clamp(60px, 8vw, 112px); line-height: .95; letter-spacing: -.07em; font-weight: 800; margin: 18px 0 7px; }
.aside-number small { font-size: .25em; letter-spacing: 0; color: var(--amber); }
.aside-rate { font-size: 24px; margin: 0; color: #d8e0ef; }
.aside-rate strong { color: #fff; }
.aside-rate span { font-size: 12px; color: #8493ad; margin-left: 8px; }
.aside-rule { width: 100%; border-top: 1px solid rgba(255,255,255,.16); margin: 34px 0 20px; }
.aside-copy > p:last-child { color: #aebbd1; line-height: 1.8; max-width: 420px; }

.brand-lockup { display: inline-flex; align-items: center; gap: 11px; color: #fff; letter-spacing: -.02em; }
.brand-lockup strong { display: block; font-size: 16px; letter-spacing: .04em; }
.brand-lockup small { display: block; margin-top: 3px; color: #8290aa; font-size: 8px; letter-spacing: .2em; }
.brand-lockup-large { color: var(--navy-900); margin-bottom: clamp(44px, 8vh, 90px); }
.brand-lockup-large small { color: var(--slate-500); }
.brand-mark { position: relative; display: inline-block; width: 26px; height: 26px; border: 2px solid var(--amber); border-radius: 7px 7px 2px 7px; transform: rotate(-9deg); }
.brand-mark::before, .brand-mark::after, .brand-mark i { content: ""; position: absolute; height: 2px; background: currentColor; transform: rotate(9deg); }
.brand-mark::before { width: 10px; left: 5px; top: 8px; color: var(--amber); }
.brand-mark::after { width: 8px; left: 7px; top: 14px; color: #8290aa; }
.brand-mark i:first-child { width: 3px; height: 3px; border-radius: 50%; left: 18px; top: 6px; background: var(--amber); }
.brand-mark i:last-child { display: none; }
.eyebrow { color: var(--slate-500); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
.eyebrow-light { color: #aebbd1; }
.auth-card h1 { max-width: 470px; margin: 14px 0 14px; font-size: clamp(34px, 4.1vw, 52px); line-height: 1.18; letter-spacing: -.055em; color: var(--navy-900); word-break: keep-all; }
.auth-card h1 em { color: var(--amber); font-style: normal; }
.auth-subtitle { margin: 0 0 34px; color: var(--slate-600); line-height: 1.8; }
.stack-form { display: grid; gap: 16px; max-width: 440px; }
.stack-form label, .field label { display: grid; gap: 7px; color: var(--slate-600); font-size: 12px; font-weight: 700; }
input, select, textarea { width: 100%; border: 1px solid var(--slate-200); border-radius: 9px; background: #fff; color: var(--navy-900); padding: 12px 13px; outline: none; transition: border-color .18s, box-shadow .18s; }
input:focus, select:focus, textarea:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,185,66,.18); }
textarea { resize: vertical; min-height: 88px; }
.entry-date-control { display: flex; align-items: stretch; gap: 5px; }
.entry-date-native { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.entry-date-text { flex: 1 1 auto; min-width: 0; }
.entry-date-today, .entry-date-calendar { min-width: 36px; border: 1px solid var(--slate-200); border-radius: 8px; background: #fff; color: var(--slate-600); font-weight: 800; }
.entry-date-today:hover, .entry-date-calendar:hover { border-color: var(--amber); color: var(--navy-900); background: var(--amber-soft); }
.invoice-id-field > label { display: flex; align-items: center; gap: 5px; }
.invoice-id-label-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.invoice-id-required { color: var(--red); }
.invoice-id-tools { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; }
.invoice-id-auto-badge { display: inline-flex !important; align-items: center; gap: 4px; padding: 5px 7px; border: 1px solid #c7d2fe; border-radius: 999px; color: #3730a3 !important; background: #eef2ff; font-size: 9px !important; }
.invoice-id-auto-badge input { width: 12px; height: 12px; margin: 0; padding: 0; }
.button { border: 0; border-radius: 9px; padding: 12px 16px; font-weight: 800; color: var(--navy-900); transition: transform .18s, box-shadow .18s, background .18s; }
.button:hover { transform: translateY(-1px); }
.button-primary { background: var(--amber); box-shadow: 0 8px 18px rgba(245,185,66,.2); }
.button-primary:hover { background: #ffc95d; }
.button-ghost { background: transparent; color: var(--slate-600); border: 1px solid var(--slate-200); }
.button-ghost:hover { background: var(--slate-100); }
.button-small { padding: 8px 11px; font-size: 11px; }
.button-wide { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.auth-note { color: var(--slate-500); font-size: 11px; margin-top: 22px; display: flex; align-items: center; gap: 7px; }
.form-error { color: var(--red); min-height: 17px; font-size: 12px; margin: 9px 0 0; }

.app-shell { min-height: 100vh; display: flex; background: var(--slate-100); }
.sidebar { width: 248px; flex: 0 0 248px; display: flex; flex-direction: column; padding: 28px 18px 18px; background: var(--navy-950); color: #fff; }
.workspace-tag { color: #76849e; border-bottom: 1px solid rgba(255,255,255,.08); padding: 27px 10px 22px; font-size: 11px; display: flex; align-items: center; gap: 8px; }
.main-nav { display: grid; gap: 4px; padding-top: 22px; }
.nav-label { color: #63718b; text-transform: uppercase; letter-spacing: .14em; font-size: 9px; font-weight: 800; padding: 7px 11px; margin-top: 11px; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 11px; border: 0; color: #8f9bb0; background: transparent; padding: 11px; border-radius: 8px; text-align: left; font-size: 12px; transition: .18s; }
.nav-item:hover, .nav-item.active { background: var(--navy-800); color: #fff; }
.nav-item.active { box-shadow: inset 3px 0 var(--amber); }
.nav-icon { width: 18px; color: #6f7d97; font-size: 15px; text-align: center; }
.nav-item.active .nav-icon { color: var(--amber); }
.sidebar-footer { margin-top: auto; padding: 16px 4px 0; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; }
.mini-profile { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mini-profile > span, .avatar-button { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--amber); color: var(--navy-900); font-size: 10px; font-weight: 900; }
.mini-profile strong, .mini-profile small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
.mini-profile strong { font-size: 11px; }
.mini-profile small { color: #7b89a1; font-size: 9px; margin-top: 2px; }
.icon-button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; color: #96a2b6; font-size: 16px; }
.icon-button:hover { background: rgba(255,255,255,.09); color: #fff; }
.workspace { min-width: 0; flex: 1; }
.topbar { min-height: 104px; background: var(--paper); border-bottom: 1px solid var(--slate-200); padding: 22px clamp(22px, 4vw, 52px); display: flex; justify-content: space-between; align-items: center; }
.topbar h2 { margin: 6px 0 0; font-size: 25px; letter-spacing: -.04em; }
.topbar-actions { display: flex; gap: 12px; align-items: center; }
.sync-pill { color: var(--slate-600); border: 1px solid var(--slate-200); border-radius: 20px; font-size: 10px; padding: 8px 11px; display: flex; align-items: center; gap: 6px; }
.avatar-button { border: 0; width: 36px; height: 36px; }
.view-root { padding: 30px clamp(22px, 4vw, 52px) 52px; max-width: 1600px; }

.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status-dot-green { color: var(--green); }
.status-dot-amber { color: var(--amber); }
.status-dot-red { color: var(--red); }
.section-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; margin-bottom: 16px; }
.section-head h3 { font-size: 17px; letter-spacing: -.03em; margin: 4px 0 0; }
.section-head p { margin: 4px 0 0; color: var(--slate-500); font-size: 12px; }
.metrics-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 29px; }
.metric-card { background: var(--paper); border: 1px solid var(--slate-200); border-radius: var(--radius); padding: 18px 19px; position: relative; overflow: hidden; }
.metric-card::after { content: ""; width: 76px; height: 76px; position: absolute; right: -25px; bottom: -33px; border-radius: 50%; border: 16px solid rgba(245,185,66,.1); }
.metric-card .metric-label { color: var(--slate-500); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.metric-value { font-size: 27px; letter-spacing: -.05em; font-weight: 850; margin: 11px 0 7px; }
.metric-value small { font-size: 12px; letter-spacing: 0; color: var(--slate-500); font-weight: 700; }
.metric-trend { font-size: 10px; color: var(--green); }
.metric-trend.neutral { color: var(--slate-500); }
.dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(290px, .75fr); gap: 18px; }
.panel { background: var(--paper); border: 1px solid var(--slate-200); border-radius: var(--radius); min-width: 0; }
.panel-pad { padding: 19px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th { color: var(--slate-500); text-align: left; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; padding: 13px 19px; border-bottom: 1px solid var(--slate-200); }
td { padding: 14px 19px; border-bottom: 1px solid #edf0f5; font-size: 12px; color: var(--slate-600); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td strong { color: var(--navy-900); font-weight: 800; }
.table-code { display: block; margin-top: 4px; font-size: 10px; font-family: ui-monospace, monospace; color: var(--slate-500); }
.badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 5px 8px; font-size: 9px; font-weight: 800; }
.badge-green { color: var(--green); background: var(--green-soft); }
.badge-amber { color: #9b6b00; background: var(--amber-soft); }
.badge-red { color: var(--red); background: var(--red-soft); }
.badge-blue { color: var(--blue); background: #e9f1ff; }
.quick-stack { display: grid; gap: 9px; }
.quick-action { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--slate-200); border-radius: 10px; padding: 12px; background: #fff; text-align: left; transition: .18s; }
.quick-action:hover { border-color: var(--amber); transform: translateX(2px); }
.quick-action > span:first-child { display: flex; align-items: center; gap: 10px; }
.quick-action-icon { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 8px; color: var(--navy-900); background: var(--amber-soft); font-size: 13px; }
.quick-action strong { display: block; font-size: 11px; }
.quick-action small { color: var(--slate-500); font-size: 9px; }
.quick-action > span:last-child { color: var(--slate-500); }
.progress-block { margin-top: 24px; }
.progress-row { display: flex; justify-content: space-between; font-size: 10px; margin: 0 0 8px; color: var(--slate-600); }
.progress-track { height: 6px; border-radius: 10px; background: var(--slate-100); overflow: hidden; }
.progress-track i { display: block; height: 100%; border-radius: inherit; background: var(--amber); }

.toolbar { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 15px; }
.toolbar > * { flex: 0 1 auto; }
.search-field { min-width: 190px; flex: 1 1 230px; }
.filter-select { min-width: 130px; }
.list-panel { overflow: hidden; }
.empty-state { padding: 42px 20px; text-align: center; color: var(--slate-500); }
.empty-state strong { display: block; color: var(--navy-900); margin-bottom: 6px; }
.inline-actions { display: flex; gap: 5px; }
.small-icon-button { border: 1px solid var(--slate-200); background: #fff; color: var(--slate-600); width: 29px; height: 29px; border-radius: 7px; }
.small-icon-button:hover { border-color: var(--amber); color: var(--navy-900); }

.directory-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.directory-card { background: var(--paper); border: 1px solid var(--slate-200); border-radius: var(--radius); padding: 17px; }
.directory-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.directory-card h4 { margin: 0; font-size: 14px; }
.directory-card p { color: var(--slate-500); font-size: 11px; line-height: 1.65; margin: 10px 0 0; white-space: pre-line; }
.directory-card .card-code { color: var(--amber); font-size: 10px; font-weight: 900; letter-spacing: .08em; }

.settings-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(300px, .7fr); gap: 18px; align-items: start; }
.form-panel { padding: 23px; }
.form-panel h3 { margin: 0 0 4px; font-size: 16px; }
.form-panel > p { color: var(--slate-500); font-size: 11px; margin: 0 0 22px; line-height: 1.6; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
.form-grid .full { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 21px; }
.qr-preview-card { text-align: center; padding: 27px; }
.qr-preview-card h3 { margin: 0 0 5px; font-size: 15px; }
.qr-preview-card p { color: var(--slate-500); font-size: 11px; line-height: 1.55; }
.qr-frame { display: grid; place-items: center; min-height: 220px; margin: 18px auto; border: 1px dashed var(--slate-300); border-radius: 11px; background: #fff; }
.qr-frame canvas { max-width: 100%; height: auto; }
.qr-placeholder { color: var(--slate-500); font-size: 11px; padding: 20px; }
.payment-image-preview { width: 100%; max-width: 235px; min-height: 150px; object-fit: contain; border-radius: 9px; border: 1px solid var(--slate-200); background: var(--slate-100); margin: 6px auto 0; display: block; }
.payment-image-placeholder { color: var(--slate-500); font-size: 11px; padding: 30px 16px; border: 1px dashed var(--slate-300); border-radius: 9px; }

.modal-backdrop { position: fixed; z-index: 20; inset: 0; background: rgba(11,17,32,.63); display: grid; place-items: center; padding: 20px; animation: fade-in .18s ease; }
.modal-card { width: min(820px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--paper); border-radius: 15px; box-shadow: 0 30px 90px rgba(0,0,0,.25); animation: slide-up .2s ease; }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 22px 24px 17px; border-bottom: 1px solid var(--slate-200); }
.modal-head h3 { margin: 0; font-size: 18px; }
.modal-head p { color: var(--slate-500); margin: 5px 0 0; font-size: 11px; }
.modal-body { padding: 22px 24px; }
.order-total-preview { background: var(--navy-900); color: #fff; border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-top: 17px; }
.order-total-preview small { color: #aebbd1; font-size: 10px; }
.order-total-preview strong { color: var(--amber); font-size: 19px; }
.close-button { border: 0; background: transparent; font-size: 23px; line-height: 1; color: var(--slate-500); }
.close-button:hover { color: var(--navy-900); }
.toast-region { position: fixed; right: 20px; top: 20px; z-index: 40; display: grid; gap: 8px; }
.toast { color: #fff; background: var(--navy-900); border-left: 3px solid var(--amber); box-shadow: var(--shadow); padding: 12px 14px; border-radius: 7px; font-size: 11px; animation: slide-in .2s ease; }

.print-area { display: none; }
.invoice-sheet { max-width: 790px; margin: 0 auto; padding: 34px; color: #111827; background: white; }
.invoice-header { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2px solid #111827; padding-bottom: 18px; }
.invoice-header h1 { font-size: 23px; margin: 0; letter-spacing: -.04em; }
.invoice-header p { margin: 5px 0 0; color: #64748b; font-size: 11px; }
.invoice-code { text-align: right; }
.invoice-code strong { font-family: monospace; font-size: 15px; }
.invoice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 20px 0; }
.invoice-grid small, .invoice-summary small { display: block; color: #64748b; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
.invoice-grid strong { display: block; margin-top: 5px; font-size: 12px; }
.invoice-table { min-width: 0; margin: 6px 0 22px; }
.invoice-table th { color: #64748b; border-color: #cbd5e1; padding: 10px 4px; }
.invoice-table td { color: #111827; border-color: #e2e8f0; padding: 11px 4px; white-space: normal; }
.invoice-bottom { display: grid; grid-template-columns: 1fr 235px; gap: 26px; align-items: start; }
.invoice-payments { border-top: 1px dotted #94a3b8; padding-top: 15px; }
.invoice-payments h4 { font-size: 11px; margin: 0 0 12px; }
.invoice-payment-flex { display: flex; gap: 17px; align-items: flex-start; }
.invoice-payment-flex canvas { width: 125px; height: 125px; }
.invoice-payment-flex img { width: 125px; height: 125px; object-fit: contain; border: 1px solid #e2e8f0; }
.invoice-payment-flex small { color: #64748b; font-size: 9px; display: block; margin-top: 5px; max-width: 130px; }
.invoice-summary { background: #f8fafc; border-radius: 8px; padding: 15px; }
.invoice-summary > div { display: flex; justify-content: space-between; font-size: 11px; padding: 5px 0; }
.invoice-summary .grand { border-top: 1px solid #cbd5e1; margin-top: 6px; padding-top: 10px; font-weight: 900; font-size: 14px; }
.invoice-footer { margin-top: 27px; padding-top: 13px; border-top: 1px solid #e2e8f0; color: #64748b; font-size: 9px; }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide-up { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slide-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }

@media (max-width: 1060px) {
  .sidebar { width: 214px; flex-basis: 214px; }
  .metrics-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .dashboard-grid, .settings-grid { grid-template-columns: 1fr; }
  .directory-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 760px) {
  .auth-shell { display: block; }
  .auth-aside { display: none; }
  .auth-card { min-height: 100vh; padding: 34px 24px; justify-content: flex-start; }
  .auth-card h1 { font-size: 39px; line-height: 1.22; }
  .brand-lockup-large { margin-bottom: 52px; }
  .sidebar { position: fixed; z-index: 15; top: 0; bottom: 0; left: -250px; transition: left .2s; box-shadow: 18px 0 40px rgba(0,0,0,.17); }
  .sidebar.open { left: 0; }
  .workspace { width: 100%; }
  .mobile-only { display: grid !important; }
  .topbar { padding: 16px 18px; gap: 10px; min-height: 86px; }
  .topbar h2 { font-size: 20px; }
  .topbar-actions { margin-left: auto; }
  .sync-pill { display: none; }
  .view-root { padding: 23px 16px 40px; }
  .metrics-grid { gap: 9px; }
  .metric-card { padding: 14px; }
  .metric-value { font-size: 21px; }
  .metric-label { font-size: 8px !important; }
  .directory-grid { grid-template-columns: 1fr; }
  .section-head { align-items: flex-start; flex-direction: column; gap: 8px; }
  .form-grid { grid-template-columns: 1fr; }

  if (action === "new-order") openOrderModal();

  if (action === "remove-order-line") { const current = collectOrderForm(); orderDraftLines = current.lines.filter((_, index) => index !== Number(actionButton.dataset.index)); renderOrderLines(); updateOrderPreview(); }
  if (action === "add-promptpay") { state.payments.promptPayAccounts = [...(state.payments.promptPayAccounts || []), { id: `pp-${Date.now()}`, account: "", name: "", enabled: true }]; renderApp(); }
  if (action === "remove-promptpay") { state.payments.promptPayAccounts = (state.payments.promptPayAccounts || []).filter((item) => item.id !== actionButton.dataset.id); renderApp(); }
  if (action === "add-mmk-bank") { state.payments.mmkBanks = [...(state.payments.mmkBanks || []), { id: `mmk-${Date.now()}`, bankName: "", accountNumber: "", accountName: "", qrUrl: "", enabled: true }]; renderApp(); }
  if (action === "remove-mmk-bank") { state.payments.mmkBanks = (state.payments.mmkBanks || []).filter((item) => item.id !== actionButton.dataset.id); renderApp(); }
  if (action === "new-cargo") openCargoModal();
  if (action === "directory-add") openDirectoryModal(actionButton.dataset.kind);
  if (action === "edit-directory") openEditDirectory(actionButton.dataset.kind, actionButton.dataset.id);
  if (action === "delete-directory") handleDeleteDirectory(actionButton.dataset.kind, actionButton.dataset.id);
  if (action === "edit-team") handleEditTeam(actionButton.dataset.id);
  if (action === "delete-team") handleDeleteTeam(actionButton.dataset.id);
  if (action === "remove-delivery-status") removeDeliveryStatus(actionButton.dataset.status);
  if (action === "close-modal") closeModal();
  if (action === "edit-order") { const order = state.orders.find((item) => item.id === actionButton.dataset.id); if (order) openEditOrder(order); }
  if (action === "print-order") { const order = state.orders.find((item) => item.id === actionButton.dataset.id); if (order) printOrder(order, false, true); }
  if (action === "download-png") { const order = state.orders.find((item) => item.id === actionButton.dataset.id); if (order) printOrder(order, false, true); }
  if (action === "close-invoice-preview") { const area = document.getElementById("printArea"); area.classList.remove("is-visible"); area.setAttribute("aria-hidden", "true"); area.innerHTML = ""; }
  if (action === "invoice-print-preview") { try { window.print(); } catch (error) { showToast("Print dialog မဖွင့်နိုင်ပါ။ Browser menu ကနေ Print ကိုရွေးပါ။"); } }
  if (action === "invoice-download-preview") { if (currentOrderForPrint) { downloadInvoicePng(currentOrderForPrint).catch((error) => { console.warn("PNG export failed", error); showToast("PNG မထုတ်နိုင်သေးပါ။ Browser download permission ကိုစစ်ပါ။"); }); } }
  if (action === "delete-order") { if (["Owner", "Manager", "Supervisor"].includes(currentUser?.role)) handleDeleteOrder(actionButton.dataset.id); }
  if (action === "delete-cargo") handleDeleteCargo(actionButton.dataset.id);
  if (action === "edit-status") { const order = state.orders.find((item) => item.id === actionButton.dataset.id); if (order) { order.paymentStatus = order.paymentStatus === "Pending" ? "Partial" : order.paymentStatus === "Partial" ? "Paid" : "Pending"; persistState(); saveToCloud("orders", order, order.id); renderApp(); showToast(`Payment status: ${order.paymentStatus}`); } }
  if (action === "toggle-cargo") { const fee = state.cargoFees.find((item) => item.id === actionButton.dataset.id); if (fee) { fee.status = fee.status === "Paid" ? "Unpaid" : "Paid"; persistState(); saveToCloud("cargoFees", fee, fee.id); renderApp(); showToast(`Cargo status: ${fee.status}`); } }
});
document.addEventListener("submit", (event) => { if (event.target.id === "loginForm") handleLogin(event); if (event.target.id === "teamForm") handleTeamSubmit(event); if (event.target.id === "orderForm") handleOrderSubmit(event); if (event.target.id === "cargoForm") handleCargoSubmit(event); if (event.target.id === "directoryForm") handleDirectorySubmit(event); if (event.target.id === "paymentForm") handlePaymentSubmit(event); if (event.target.id === "statusForm") handleStatusSubmit(event); });
document.addEventListener("input", (event) => { if (event.target.id === "orderSearch") { state.orderQuery = event.target.value; renderApp(); const input = document.getElementById("orderSearch"); input.focus(); input.setSelectionRange(input.value.length, input.value.length); } if (event.target.closest("#orderForm")) { updateOrderPreview(); } if (event.target.id === "paymentPreviewAmount") { bindPaymentPreview(); } });
document.addEventListener("change", (event) => { if (event.target.id === "orderFilter") { state.orderFilter = event.target.value; renderApp(); } if (["orderDate", "autoInvoiceId", "orderForm"].includes(event.target.id) || event.target.name === "type") syncAutoInvoiceId(); if (event.target.id === "invoiceCurrency") toggleInvoicePaymentFields(); if (event.target.id === "promptPayChoice" || event.target.id === "paymentPreviewAmount") bindPaymentPreview(); });
document.getElementById("demoLoginButton")?.addEventListener("click", enterDemo);
document.getElementById("logoutButton").addEventListener("click", signOut);
document.getElementById("mobileMenuButton").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));

(async function boot() { await setupFirebase(); if (sessionStorage.getItem("bkkpos-demo") === "1") sessionStorage.removeItem("bkkpos-demo"); })();

    </script>
